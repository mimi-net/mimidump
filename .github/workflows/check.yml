name: Check project

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libpcap-dev libbsd-dev bear clang-format clang-tidy
      - name: Check formatting
        run: clang-format --dry-run --Werror *.c
      - name: Prepare compilation database
        run: bear -- make
      - name: Check tidy
        run: clang-tidy *.c
